# Azure Load Testing - Azure AI Search - Agentic Retrieval load test configuration
# https://learn.microsoft.com/en-us/azure/load-testing/reference-test-config-yaml
version: v0.1

# ── Identity ──────────────────────────────────────────────────────────────────
# Unique test identifier.  Change this to match an existing test or leave as-is
# to create a new one when the test is first uploaded.
testId: azure-ai-search-agentic-retrieval

displayName: Azure AI Search - Agentic Retrieval
description: Using the Knowledge Retrieval REST API 2025-11-01-preview

# ── Test plan ─────────────────────────────────────────────────────────────────
testPlan: locustfile.py
testType: Locust
configurationFiles:
  - requirements.txt

# ── Load shape ────────────────────────────────────────────────────────────────
engineInstances: 1  # Increase for higher concurrency / geo-distribution

# ── Environment variables ─────────────────────────────────────────────────────
# These are passed to the Locust worker process both for local and cloud runs.
# Update the placeholder values before running the test.
env:
  # -- Locust load shape parameters --
  - name: LOCUST_USERS
    value: "200"
  - name: LOCUST_SPAWN_RATE
    value: "3"
  - name: LOCUST_RUN_TIME
    value: "120"
  
  # -- Azure AI Search - Agentic Retrieval parameters --
  - name: SEARCH_ENDPOINT
    value: 'https://<your-service>.search.windows.net'   # e.g. https://mysearch.search.windows.net

  - name: KNOWLEDGE_BASE_NAME
    value: 'your-knowledge-base'                         # target knowledge base for Agentic Retrieval

# ── Failure criteria ──────────────────────────────────────────────────────────
# The test is marked as failed if any of these thresholds are breached.
failureCriteria:
  - avg(response_time_ms) > 15000   # average response time must stay below 15 s
  - error > 0.05                    # error rate must stay below 5 %

# ── Exisiting resource references ──────────────────────────────────────────────
resourceId: /subscriptions/<sub-id>/resourceGroups/<rg>/providers/Microsoft.LoadTestService/loadTests/<loadtest-resource-name>

# ── Identities to be used by the load testing engine and monitoring components ─
referenceIdentities:
  - type: SystemAssigned
    kind: Engine
  - type: SystemAssigned
    kind: Metrics

# ── Monitoring server-side Azure AI Search metrics ────────────────────────────
appComponents:
  - resourceId: >-
      /subscriptions/<sub-id>/resourceGroups/<rg>/providers/Microsoft.Search/searchServices/<search-resource-name>
    resourceType: Microsoft.Search/searchServices
    resourceName: <search-resource-name>
    resourceGroup: <rg>
    subscriptionId: <sub-id>
